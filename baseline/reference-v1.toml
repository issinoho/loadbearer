# loadbearer reference baseline — v1
#
# CALIBRATED. Each value is the geometric mean of that metric across seven real
# machines benchmarked with `loadbearer run --duration thorough` from the
# released (default, non-native) build — see the list below. A machine that
# matches the baseline on a metric scores ~1000 on it.
#
#   host              CPU                              cores  OS
#   SGS-D47TDY3        Intel Core i7-1370P (2023)         20  Windows 11
#   dell-ubuntu        Intel Core i7-10510U (2019)         8  Linux
#   ThinkPad-X280      Intel Core i5-8350U (2018)          8  Linux
#   DESKTOP-QRLKF2J    Intel N95 (2023)                    4  Windows 11
#   docker-nuc         Intel Core i5-5250U (2015)          4  Linux
#   LYNN-LAPTOP        Intel Core i5-6300U (2015)          4  Windows 10
#   openvms            Intel Celeron J4005 (2017)          2  Linux
#
# It is a SMALL, INTEL-ONLY sample skewed toward older low-power laptops, so
# the anchors sit on the low side: a current mainstream machine grades A/S, and
# five of the seven lack the SHA extensions so `sha256` anchors low. Treat the
# absolute score and letter as a rough position and lean on `loadbearer compare`
# — baseline-independent — for anything that has to be defensible. The baseline
# is calibration data, not part of the stability contract (see VERSIONING.md);
# it will be recalibrated as more machines are measured.
#
# KNOWN STALE: `aes_gcm`. These values were measured with aes-gcm 0.10 / aes
# 0.8, whose x86 backend used AES-NI one block per instruction. From aes 0.9
# the backend also takes the VAES paths, two or more blocks per instruction,
# which roughly DOUBLES measured AES-GCM throughput on a CPU that has VAES
# (Intel Ice Lake / AMD Zen 3 and later). Measured on SGS-D47TDY3, which is in
# this sample, at the `--duration thorough` these values were calibrated with:
# 1638.6 -> 3626.6 MiB/s, +121%, cv 0.56% and 0.34%, both `high` confidence.
# (An interleaved A/B at `--duration normal` gave +103%, with the new arm still
# thermally ramping — the thorough figure is the steadier one.)
#
# Only two of the seven machines above (the i7-1370P and the N95) have VAES, so
# a correct recalibration means re-running all seven with the new build rather
# than scaling this figure — the anchor is a geomean, and adjusting it by
# modelling which machines changed would put an unverified number into
# calibration data. Until that happens this anchor is UNDERSTATED for
# VAES-capable hardware, and such machines will score high on this one subtest.
# Same shape of caveat as the arm64 note in the README: what the number
# reflects is the build's crypto path as much as the silicon.
#
# ALSO STALE: `int_multi` and `float_multi`. These were captured as the median
# of the timed runs. An all-core run series doesn't scatter around a centre, it
# decays — every core at full tilt holds boost for a few seconds then drops to
# the package power limit — so a median reports whichever regime straddles the
# middle sample. Two identical `--duration thorough` runs on the i7-1370P in
# this sample came out 42 % apart on `int_multi` (103.5k vs 72.7k) for that
# reason alone, and the seven anchor machines each landed on one side or the
# other of their own thermal knee.
#
# These subtests now report the *peak* of their runs instead, which held to
# ~7 % across presets and run counts where the median swung ~54 %. The anchors
# above were not re-measured, so they sit somewhere between the two regimes and
# are low for a machine that boosts: expect all-core CPU to score high against
# them until all seven machines are re-run. `int_single` / `float_single` are
# unaffected — one core doesn't reach the package limit, and they measured the
# same either way.
#
# Regenerate:  loadbearer baseline run1.json run2.json … --name reference-v1 \
#                --description "…" > baseline/reference-v1.toml && cargo build

name = "reference-v1"
description = "geomean of 7 Intel machines (2015-2023), calibrated 2026-08-29"

[components.cpu]
int_single   = 6432.0    # Mops/s
int_multi    = 17660.0   # Mops/s (pre-peak — see the ALL-CORE note below)
float_single = 5684.0    # MFLOP/s
float_multi  = 23030.0   # MFLOP/s (pre-peak — see the ALL-CORE note below)
hash         = 1873.0    # MiB/s   (BLAKE3, SIMD)
compress     = 44.37     # MiB/s   (DEFLATE level 6)
aes_gcm      = 760.2     # MiB/s   (AES-256-GCM, single thread; pre-VAES — see
                         #          the KNOWN STALE note above)
sha256       = 355.7     # MiB/s   (SHA-256, single thread; mostly software in this sample)

[components.memory]
bw_read     = 10.64      # GiB/s   (single thread)
bw_write    = 6.849      # GiB/s
bw_copy     = 6.498      # GiB/s
bw_read_mt  = 16.32      # GiB/s   (all logical CPUs, summed)
latency     = 147.6      # ns      (lower is better)

[components.disk]
seq_write  = 342.3       # MiB/s   (with fsync)
seq_read   = 571.6       # MiB/s
rand_read  = 8195.0      # IOPS    (QD1, 4 KiB)
rand_write = 10820.0     # IOPS    (QD1, 4 KiB)

[components.network]
# Loopback (127.0.0.1) network-stack figures, not a physical link.
tcp_stream   = 1.956     # GiB/s   (single stream)
tcp_parallel = 2.939     # GiB/s   (all logical CPUs)
tcp_rtt      = 39.80     # us      (lower is better)
udp_pps      = 93.13     # Kpps    (successful sends/sec)

[components.gpu]
# Geomean over the 4 machines that had a usable GPU (3 iGPUs + one Iris Xe-class
# part). GPU is measured and shown but never folded into the overall grade.
compute_fp32 = 282.0     # GFLOP/s (FP32 FMA)
bandwidth    = 20.52     # GiB/s   (VRAM read)
