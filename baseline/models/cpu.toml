# loadbearer CPU model reference — what a healthy example of each
# CPU produces on loadbearer's kernels, from the released (portable / SSE2)
# build at `--duration thorough`. Lets a single run tell you whether a chip is
# performing to spec. Data, not API (see VERSIONING.md); CPU-only — memory,
# disk and network are not model-attributable. Grown by PR:
#   loadbearer models --add run1.json run2.json > baseline/models/cpu.toml
#
# Seeded 2026-08-30 from the 7 machines that calibrated reference-v1;
# Apple M3 Pro added 2026-08-30 from a 1.1.1 run (Arm/NEON build — the
# aes_gcm / sha256 figures reflect loadbearer not using Arm crypto
# acceleration, not the silicon).
# Intel Core i7-1265U added 2026-08-31 from a 1.1.2 thorough run.
# Apple M4 added 2026-09-01 from a 1.1.3 thorough run (Arm/NEON build — same
# aes_gcm / sha256 caveat as the M3 Pro).

[[cpu]]
model = "Apple M4"
aliases = ["M4"]
topology = "10C / 10T"
samples = 1
measured = "2026-09-01"
tool_version = "1.1.3"
build = "portable"
int_single   = 22056
int_multi    = 126535
float_single = 10115
float_multi  = 73714
hash         = 2344
compress     = 153
aes_gcm      = 224
sha256       = 575

