# Example config for `loadbearer run --config loadbearer.example.toml`.
# Every key is optional. Command-line switches override anything set here.

# Scoring profile: general | dev-workstation | content-creation | server
profile = "general"

# Thoroughness: short | normal | thorough
duration = "normal"

# Display-curve exponent (0.05–3.0). Lower compresses the extremes toward 1000.
curve_k = 0.5

# Restrict to a subset of benchmarks.
# only = ["cpu", "memory"]

# Directory for the disk benchmark's scratch file. Point at a real disk.
# target_dir = "/var/tmp"

# Fixed seed for reproducible workloads.
# seed = 42

# Override the number of timed iterations per subtest.
# runs = 5

# Labels carried into the result file, for a fleet collector to group by.
# Metadata only: nothing here affects a measurement or a grade. `--tag k=v`
# overrides an individual key without discarding the rest, so a config pushed
# fleet-wide can hold the constants while the command line adds the specifics.
# Keys take letters, digits, '_', '-' and '.'.
# [tags]
# site = "glasgow"
# department = "engineering"
# ring = "pilot"

# Post the result to a loadbearer-fleet server when the run finishes. Off
# unless set: without it loadbearer makes no network call of its own. The
# token is read from a file, never written here, so this file can be copied
# and shared without the credential going with it. Generate one on the server
# with `loadbearer-fleet token new`, and make the file readable only by the
# account loadbearer runs as. A token scoped to a site needs that site's tag
# above. --upload / --upload-token-file override these.
# [upload]
# url = "https://fleet.example.com/api/upload"
# token_file = "C:/ProgramData/loadbearer/fleet-token"
