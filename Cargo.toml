[package]
name = "loadbearer"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
description = "CLI system-assessment tool: benchmarks CPU, memory, disk and network, then grades the machine"
repository = "https://github.com/issinoho/loadbearer"
license = "MIT"
readme = "README.md"
keywords = ["benchmark", "cpu", "memory", "disk", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
time = { version = "0.3", features = ["formatting"] }
ratatui = "0.30"
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }
anyhow = "1"
blake3 = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
core_affinity = "0.8"
aes-gcm = "0.10"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
time = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
