name: Build and publish release binaries

# Fires on every version tag push (v0.1.0, v0.2.0, ...): build a
# self-contained binary for Windows and Linux, zip/tar each with the
# docs, and attach both to the GitHub Release for that tag.
#
# A manual workflow_dispatch run builds the same artifacts (downloadable
# from the run page) but only publishes a Release if publish_release is
# ticked -- so an experimental build can be verified on real hardware
# without leaving a public Release behind.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release from this run (leave unchecked for a throwaway test build)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: loadbearer.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: loadbearer
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Sign the Windows binary
        # Opt-in Authenticode signing: runs only when an organisation has put
        # a code-signing cert in the repo secrets. With no secret it prints a
        # line and exits 0 — the release ships unsigned, exactly as before.
        # Secrets: WINDOWS_PFX_BASE64 (base64 of a .pfx), WINDOWS_PFX_PASSWORD.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host "No code-signing cert configured — shipping the binary unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'code-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            | Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          $exe = "target\${{ matrix.target }}\release\${{ matrix.bin }}"
          & $signtool sign /f $pfx /p $env:PFX_PASS /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $exe
          if ($LASTEXITCODE -ne 0) { Remove-Item $pfx -Force; throw "signtool sign failed" }
          & $signtool verify /pa $exe
          Remove-Item $pfx -Force
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Tag push -> version is the tag without the leading "v".
          # Manual run off a branch -> fall back to Cargo.toml + "-dev".
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev"
          fi
          name="loadbearer-${version}-${{ matrix.target }}"
          mkdir -p "staging/${name}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${name}/"
          cp README.md LICENSE CHANGELOG.md loadbearer.example.toml "staging/${name}/"
          cd staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" "${name}" >/dev/null
          else
            tar czf "../${name}.tar.gz" "${name}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            loadbearer-*.zip
            loadbearer-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull this version's CHANGELOG section for the release body
        # Tolerant of a non-version ref (a manual run off a branch): an
        # unmatched version just leaves the file empty and the Release
        # falls back to GitHub's auto-generated notes.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          ls -l release-assets

      - name: Checksums
        # SHA256SUMS covers each archive *and* the bare executable inside it —
        # the exe hash is what a WDAC / AppLocker file-hash allow rule needs
        # (hash rules permit an unsigned binary; publisher rules don't).
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS
          for z in *.zip; do
            unzip -p "$z" '*/loadbearer.exe' | sha256sum \
              | sed "s#-#loadbearer.exe  (inside $z)#" >> SHA256SUMS
          done
          for t in *.tar.gz; do
            tar -xzOf "$t" --wildcards '*/loadbearer' | sha256sum \
              | sed "s#-#loadbearer  (inside $t)#" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "loadbearer ${{ github.ref_name }}"
          body_path: release-notes.md
          generate_release_notes: true
          files: release-assets/*
