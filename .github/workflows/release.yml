name: Build and publish release binaries

# Fires on every version tag push (v0.1.0, v0.2.0, ...): build a
# self-contained binary for Windows and Linux, zip/tar each with the
# docs, and attach both to the GitHub Release for that tag.
#
# A manual workflow_dispatch run builds the same artifacts (downloadable
# from the run page) but only publishes a Release if publish_release is
# ticked -- so an experimental build can be verified on real hardware
# without leaving a public Release behind.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release from this run (leave unchecked for a throwaway test build)"
        type: boolean
        default: false

permissions:
  contents: write
  # For actions/attest-build-provenance: mint an OIDC token and write the
  # attestation to the repo. The `release` job doesn't use these; harmless.
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: loadbearer.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: loadbearer
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # No CI code signing: the Certum SimplySign cloud cert has no unattended
      # API — it only unlocks via a SimplySign Desktop session, which needs a
      # persistent, already-authenticated machine (not a fresh hosted runner).
      # CI always ships this exe unsigned; the maintainer re-signs it locally
      # after publish with scripts/sign-windows-release.ps1 and replaces the
      # release assets. See CODE_SIGNING_POLICY.md.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Tag push -> version is the tag without the leading "v".
          # Manual run off a branch -> fall back to Cargo.toml + "-dev".
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)-dev"
          fi
          name="loadbearer-${version}-${{ matrix.target }}"
          mkdir -p "staging/${name}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "staging/${name}/"
          cp README.md LICENSE CHANGELOG.md VERSIONING.md loadbearer.example.toml "staging/${name}/"
          # Man page + shell completions, generated by build.rs next to the binary.
          assets="target/${{ matrix.target }}/release"
          [ -f "$assets/loadbearer.1" ] && cp "$assets/loadbearer.1" "staging/${name}/"
          mkdir -p "staging/${name}/completions"
          for f in loadbearer.bash _loadbearer loadbearer.fish _loadbearer.ps1; do
            [ -f "$assets/$f" ] && cp "$assets/$f" "staging/${name}/completions/"
          done
          cd staging
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" "${name}" >/dev/null
          else
            tar czf "../${name}.tar.gz" "${name}"
          fi

      # Signed build-provenance attestation for the release archive: ties it to
      # this exact workflow run, commit and repository. Verifiable with no
      # certificate via `gh attestation verify <file> --repo issinoho/loadbearer`
      # (trust root is GitHub's Sigstore). Runs per matrix leg — Windows attests
      # the .zip, Linux the .tar.gz. Bump the major as newer releases land.
      - name: Attest build provenance
        # Skip on a throwaway workflow_dispatch build (same gate as the release
        # job) so a test run leaves no public attestation behind.
        if: github.event_name == 'push' || inputs.publish_release
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            loadbearer-*.zip
            loadbearer-*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            loadbearer-*.zip
            loadbearer-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull this version's CHANGELOG section for the release body
        # Tolerant of a non-version ref (a manual run off a branch): an
        # unmatched version just leaves the file empty and the Release
        # falls back to GitHub's auto-generated notes.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "( |$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifacts into one directory
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          ls -l release-assets

      - name: Checksums
        # SHA256SUMS covers each archive *and* the bare executable inside it —
        # the exe hash is what a WDAC / AppLocker file-hash allow rule needs
        # (hash rules permit an unsigned binary; publisher rules don't).
        run: |
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS
          for z in *.zip; do
            unzip -p "$z" '*/loadbearer.exe' | sha256sum \
              | sed "s#-#loadbearer.exe  (inside $z)#" >> SHA256SUMS
          done
          for t in *.tar.gz; do
            tar -xzOf "$t" --wildcards '*/loadbearer' | sha256sum \
              | sed "s#-#loadbearer  (inside $t)#" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Create/update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "loadbearer ${{ github.ref_name }}"
          body_path: release-notes.md
          generate_release_notes: true
          files: release-assets/*

  # Open the version-bump PR against microsoft/winget-pkgs for this release.
  # `wingetcreate update` pulls the existing manifest, swaps in the new version /
  # URL / hash and submits — so the package must already exist there (do the
  # first submission by hand from packaging/winget/; see its README). No-op
  # until the WINGET_TOKEN secret (a classic PAT with `public_repo`) is set, and
  # only on real tag pushes.
  winget:
    needs: release
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $url = "https://github.com/issinoho/loadbearer/releases/download/${{ github.ref_name }}/loadbearer-$version-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update Issinoho.Loadbearer `
            --version $version `
            --urls "$url" `
            --submit `
            --token $env:WINGET_TOKEN

      - name: Note when the winget token is unset
        if: env.WINGET_TOKEN == ''
        run: echo "WINGET_TOKEN not set - skipping the winget-pkgs submission."
