name: CI

# Format, lint and test on every push to main and every pull request
# (Dependabot's included). This is the signal a PR gets before merge;
# release.yml is separate and only fires on version tags.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Add clippy and rustfmt
        run: rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        # One canonical formatting check is enough; skip it on the second OS.
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
